services:
  country-service-db:
    container_name: country-service-db
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  country-service:
    container_name: country-service
    image: country-service
    build: .
    depends_on:
      country-service-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: country-service-db
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      COUNTRIES_EXPORT_OUTPUT_DIR: /app/output
      SPRINGDOC_API_DOCS_ENABLED: "true"
    volumes:
      - export-output:/app/output
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
  export-output:
