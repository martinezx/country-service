spring:
  datasource:
    url: jdbc:h2:mem:countries;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

springdoc:
  api-docs:
    enabled: true

logging:
  level:
    org.xmdf.countryservice.adapter.out.batch.logging: DEBUG
