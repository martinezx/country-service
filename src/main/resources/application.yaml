spring:
  application:
    name: country-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s
